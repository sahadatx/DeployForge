name: DeployForge Control Plane Images

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: control-plane-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, scan, and inventory ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: backend
            dockerfile: backend/Dockerfile
          - component: dashboard
            context: frontend
            dockerfile: frontend/Dockerfile.production
          - component: postgres-backup
            context: .
            dockerfile: deploy/backup/Dockerfile
          - component: audit-exporter
            context: .
            dockerfile: deploy/audit-exporter/Dockerfile
          - component: apk-parser
            context: services/apk-parser
            dockerfile: services/apk-parser/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451d1cb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the ${{ matrix.component }} image for analysis
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: local/deployforge-${{ matrix.component }}:ci
          cache-from: type=gha,scope=control-plane-${{ matrix.component }}
          cache-to: type=gha,scope=control-plane-${{ matrix.component }},mode=max

      - name: Scan for high and critical vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: local/deployforge-${{ matrix.component }}:ci
          fail-build: true
          severity-cutoff: high
          output-format: table

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: local/deployforge-${{ matrix.component }}:ci
          format: cyclonedx-json
          output-file: deployforge-${{ matrix.component }}.cdx.json
          upload-artifact: true
          upload-release-assets: false

  publish:
    name: Publish, sign, and attest ${{ matrix.component }}
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: backend
            dockerfile: backend/Dockerfile
          - component: dashboard
            context: frontend
            dockerfile: frontend/Dockerfile.production
          - component: postgres-backup
            context: .
            dockerfile: deploy/backup/Dockerfile
          - component: audit-exporter
            context: .
            dockerfile: deploy/audit-exporter/Dockerfile
          - component: apk-parser
            context: services/apk-parser
            dockerfile: services/apk-parser/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451d1cb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute immutable image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.component }}"
          echo "name=$repository" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$repository:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "release_tag=$repository:${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.sha_tag }}
            ${{ steps.image.outputs.release_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=control-plane-${{ matrix.component }}
          cache-to: type=gha,scope=control-plane-${{ matrix.component }},mode=max

      - name: Pull the exact published digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker pull "${IMAGE}@${DIGEST}"

      - name: Scan the exact digest for high and critical vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: grype-${{ matrix.component }}.json

      - name: Prepare a digest-bound Grype result predicate
        run: python3 scripts/prepare-grype-attestation.py grype-${{ matrix.component }}.json grype-${{ matrix.component }}.predicate.json

      - name: Generate CycloneDX SBOM for the published digest
        id: sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: deployforge-${{ matrix.component }}.cdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Sign the immutable image digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest SLSA provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest the image SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: deployforge-${{ matrix.component }}.cdx.json
          push-to-registry: true

      - name: Attest the Grype vulnerability result
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://deployforge.dev/attestations/grype/v1
          predicate-path: grype-${{ matrix.component }}.predicate.json
          push-to-registry: true
