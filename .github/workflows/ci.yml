name: DeployForge CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm:
    name: Validate production Kubernetes chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Lint Helm chart
        run: helm lint --strict deploy/helm/deployforge
      - name: Render chart with optional production components enabled
        run: >-
          helm template deployforge deploy/helm/deployforge
          --namespace deployforge
          --values deploy/helm/ci-values.yaml
          > "$RUNNER_TEMP/deployforge-rendered.yaml"

  demo-service:
    name: Demo service image and vulnerability gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the demo image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: examples/demo-service
          file: examples/demo-service/Dockerfile
          push: false
          load: true
          tags: local/deployforge-demo-service:ci
      - name: Scan the image for high and critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: local/deployforge-demo-service:ci
          fail-build: true
          severity-cutoff: high
          output-format: table

  backend:
    name: Backend checks and PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deployforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deployforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEPLOYFORGE_APP_ENV: development
      DEPLOYFORGE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/deployforge
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Audit backend dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Check backend style
        working-directory: backend
        run: ruff check app tests
      - name: Apply and verify PostgreSQL migrations
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend typecheck, build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build dashboard
        working-directory: frontend
        run: npm run build
      - name: Install Chromium for dashboard browser checks
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run dashboard end-to-end checks
        working-directory: frontend
        run: npm run test:e2e
