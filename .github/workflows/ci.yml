name: DeployForge CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo-service:
    name: Demo service image and vulnerability gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the demo image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: examples/demo-service
          file: examples/demo-service/Dockerfile
          push: false
          load: true
          tags: local/deployforge-demo-service:ci
      - name: Scan the image for high and critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: local/deployforge-demo-service:ci
          fail-build: true
          severity-cutoff: high

  backend:
    name: Backend checks and PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deployforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deployforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEPLOYFORGE_APP_ENV: development
      DEPLOYFORGE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/deployforge
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Audit backend dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Check backend style
        working-directory: backend
        run: ruff check app tests
      - name: Apply and verify PostgreSQL migrations
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend typecheck, build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build dashboard
        working-directory: frontend
        run: npm run build
