apiVersion: v1
kind: LimitRange
metadata:
  name: demo-staging-defaults
  namespace: demo-staging
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 96Mi
      default:
        cpu: 500m
        memory: 256Mi
      min:
        cpu: 50m
        memory: 32Mi
      max:
        cpu: "1"
        memory: 512Mi
