limit_req_zone $binary_remote_addr zone=deployforge_callback:1m rate=5r/s;

server {
    listen 127.0.0.1:8080;
    server_name _;
    server_tokens off;

    access_log off;
    client_max_body_size 256k;
    client_body_timeout 10s;

    location ~ "^/api/v1/build-runs/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}/callback$" {
        limit_except POST { deny all; }
        limit_req zone=deployforge_callback burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /api/v1/applications/deployforge-demo-staging {
        limit_except GET { deny all; }

        proxy_pass https://127.0.0.1:18443;
        proxy_http_version 1.1;
        proxy_set_header Host argocd-server.argocd.svc.cluster.local;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name argocd-server.argocd.svc.cluster.local;
        # Local Argo CD uses its generated certificate; this origin is loopback-only.
        proxy_ssl_verify off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /api/v1/applications/deployforge-demo-staging/sync {
        limit_except POST { deny all; }

        proxy_pass https://127.0.0.1:18443;
        proxy_http_version 1.1;
        proxy_set_header Host argocd-server.argocd.svc.cluster.local;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name argocd-server.argocd.svc.cluster.local;
        # The DeployForge worker sends a narrowly scoped Argo CD bearer token.
        proxy_ssl_verify off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
