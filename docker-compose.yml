services:
  api:
    build:
      context: ./backend
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      DEPLOYFORGE_APP_ENV: ${DEPLOYFORGE_APP_ENV:-development}
      DEPLOYFORGE_LOG_LEVEL: ${DEPLOYFORGE_LOG_LEVEL:-INFO}
      DEPLOYFORGE_DATABASE_URL: ${DEPLOYFORGE_DATABASE_URL:-sqlite:////data/deployforge.db}
      DEPLOYFORGE_SESSION_SECRET: ${DEPLOYFORGE_SESSION_SECRET:-}
      DEPLOYFORGE_SESSION_COOKIE_SECURE: ${DEPLOYFORGE_SESSION_COOKIE_SECURE:-false}
      DEPLOYFORGE_OIDC_DISCOVERY_URL: ${DEPLOYFORGE_OIDC_DISCOVERY_URL:-}
      DEPLOYFORGE_OIDC_CLIENT_ID: ${DEPLOYFORGE_OIDC_CLIENT_ID:-}
      DEPLOYFORGE_OIDC_CLIENT_SECRET: ${DEPLOYFORGE_OIDC_CLIENT_SECRET:-}
      DEPLOYFORGE_OIDC_REDIRECT_URI: ${DEPLOYFORGE_OIDC_REDIRECT_URI:-}
      DEPLOYFORGE_OIDC_ADMIN_EMAILS: ${DEPLOYFORGE_OIDC_ADMIN_EMAILS:-}
      DEPLOYFORGE_FRONTEND_BASE_URL: ${DEPLOYFORGE_FRONTEND_BASE_URL:-http://localhost:5173}
      DEPLOYFORGE_DEV_AUTH_ENABLED: ${DEPLOYFORGE_DEV_AUTH_ENABLED:-true}
      DEPLOYFORGE_DEV_AUTH_AUTO_ADMIN_FIRST_USER: ${DEPLOYFORGE_DEV_AUTH_AUTO_ADMIN_FIRST_USER:-true}
      DEPLOYFORGE_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${DEPLOYFORGE_WORKER_HEARTBEAT_INTERVAL_SECONDS:-10}
      DEPLOYFORGE_WORKER_HEARTBEAT_STALE_AFTER_SECONDS: ${DEPLOYFORGE_WORKER_HEARTBEAT_STALE_AFTER_SECONDS:-30}
      DEPLOYFORGE_TELEMETRY_RETENTION_DAYS: ${DEPLOYFORGE_TELEMETRY_RETENTION_DAYS:-31}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      DEPLOYFORGE_GITHUB_ACTIONS_TOKEN: ${DEPLOYFORGE_GITHUB_ACTIONS_TOKEN:-}
      DEPLOYFORGE_GITHUB_API_URL: ${DEPLOYFORGE_GITHUB_API_URL:-https://api.github.com}
      DEPLOYFORGE_GITHUB_ACTIONS_WORKFLOW_PATH: ${DEPLOYFORGE_GITHUB_ACTIONS_WORKFLOW_PATH:-.github/workflows/deployforge-build.yml}
      DEPLOYFORGE_INFRASTRUCTURE_WORKFLOW_PATH: ${DEPLOYFORGE_INFRASTRUCTURE_WORKFLOW_PATH:-.github/workflows/deployforge-infrastructure.yml}
      DEPLOYFORGE_BUILD_CALLBACK_SECRET: ${DEPLOYFORGE_BUILD_CALLBACK_SECRET:-}
      DEPLOYFORGE_BUILD_CALLBACK_PUBLIC_URL: ${DEPLOYFORGE_BUILD_CALLBACK_PUBLIC_URL:-}
      DEPLOYFORGE_BUILD_CALLBACK_TIMEOUT_SECONDS: ${DEPLOYFORGE_BUILD_CALLBACK_TIMEOUT_SECONDS:-14400}
      DEPLOYFORGE_BUILD_MAX_CRITICAL_VULNERABILITIES: ${DEPLOYFORGE_BUILD_MAX_CRITICAL_VULNERABILITIES:-0}
      DEPLOYFORGE_BUILD_MAX_HIGH_VULNERABILITIES: ${DEPLOYFORGE_BUILD_MAX_HIGH_VULNERABILITIES:-0}
      DEPLOYFORGE_ARGOCD_API_URL: ${DEPLOYFORGE_ARGOCD_API_URL:-}
      DEPLOYFORGE_ARGOCD_AUTH_TOKEN: ${DEPLOYFORGE_ARGOCD_AUTH_TOKEN:-}
      DEPLOYFORGE_ARGOCD_API_TIMEOUT_SECONDS: ${DEPLOYFORGE_ARGOCD_API_TIMEOUT_SECONDS:-15}
      DEPLOYFORGE_GITOPS_SYNC_TIMEOUT_SECONDS: ${DEPLOYFORGE_GITOPS_SYNC_TIMEOUT_SECONDS:-1800}
      DEPLOYFORGE_GITOPS_RECONCILE_INTERVAL_SECONDS: ${DEPLOYFORGE_GITOPS_RECONCILE_INTERVAL_SECONDS:-10}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - deployforge-data:/data
    networks:
      - control-plane
      - parser-isolated
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      DEPLOYFORGE_APP_ENV: ${DEPLOYFORGE_APP_ENV:-development}
      DEPLOYFORGE_RUNTIME_ROLE: worker
      DEPLOYFORGE_LOG_LEVEL: ${DEPLOYFORGE_LOG_LEVEL:-INFO}
      DEPLOYFORGE_DATABASE_URL: ${DEPLOYFORGE_DATABASE_URL:-sqlite:////data/deployforge.db}
      DEPLOYFORGE_SESSION_SECRET: ${DEPLOYFORGE_SESSION_SECRET:-}
      DEPLOYFORGE_SESSION_COOKIE_SECURE: ${DEPLOYFORGE_SESSION_COOKIE_SECURE:-false}
      DEPLOYFORGE_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${DEPLOYFORGE_WORKER_HEARTBEAT_INTERVAL_SECONDS:-10}
      DEPLOYFORGE_WORKER_HEARTBEAT_STALE_AFTER_SECONDS: ${DEPLOYFORGE_WORKER_HEARTBEAT_STALE_AFTER_SECONDS:-30}
      DEPLOYFORGE_TELEMETRY_RETENTION_DAYS: ${DEPLOYFORGE_TELEMETRY_RETENTION_DAYS:-31}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      DEPLOYFORGE_GITHUB_ACTIONS_TOKEN: ${DEPLOYFORGE_GITHUB_ACTIONS_TOKEN:-}
      DEPLOYFORGE_GITHUB_API_URL: ${DEPLOYFORGE_GITHUB_API_URL:-https://api.github.com}
      DEPLOYFORGE_GITHUB_ACTIONS_WORKFLOW_PATH: ${DEPLOYFORGE_GITHUB_ACTIONS_WORKFLOW_PATH:-.github/workflows/deployforge-build.yml}
      DEPLOYFORGE_INFRASTRUCTURE_WORKFLOW_PATH: ${DEPLOYFORGE_INFRASTRUCTURE_WORKFLOW_PATH:-.github/workflows/deployforge-infrastructure.yml}
      DEPLOYFORGE_BUILD_CALLBACK_SECRET: ${DEPLOYFORGE_BUILD_CALLBACK_SECRET:-}
      DEPLOYFORGE_BUILD_CALLBACK_PUBLIC_URL: ${DEPLOYFORGE_BUILD_CALLBACK_PUBLIC_URL:-}
      DEPLOYFORGE_BUILD_CALLBACK_TIMEOUT_SECONDS: ${DEPLOYFORGE_BUILD_CALLBACK_TIMEOUT_SECONDS:-14400}
      DEPLOYFORGE_BUILD_MAX_CRITICAL_VULNERABILITIES: ${DEPLOYFORGE_BUILD_MAX_CRITICAL_VULNERABILITIES:-0}
      DEPLOYFORGE_BUILD_MAX_HIGH_VULNERABILITIES: ${DEPLOYFORGE_BUILD_MAX_HIGH_VULNERABILITIES:-0}
      DEPLOYFORGE_ARGOCD_API_URL: ${DEPLOYFORGE_ARGOCD_API_URL:-}
      DEPLOYFORGE_ARGOCD_AUTH_TOKEN: ${DEPLOYFORGE_ARGOCD_AUTH_TOKEN:-}
      DEPLOYFORGE_ARGOCD_API_TIMEOUT_SECONDS: ${DEPLOYFORGE_ARGOCD_API_TIMEOUT_SECONDS:-15}
      DEPLOYFORGE_GITOPS_SYNC_TIMEOUT_SECONDS: ${DEPLOYFORGE_GITOPS_SYNC_TIMEOUT_SECONDS:-1800}
      DEPLOYFORGE_GITOPS_RECONCILE_INTERVAL_SECONDS: ${DEPLOYFORGE_GITOPS_RECONCILE_INTERVAL_SECONDS:-10}
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 30s
    volumes:
      - deployforge-data:/data
    networks:
      - control-plane
      - parser-isolated
    restart: unless-stopped

  dashboard:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_BACKEND_ORIGIN: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - control-plane
    restart: unless-stopped

  apk-parser:
    build:
      context: ./services/apk-parser
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - parser-isolated
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  control-plane:
    driver: bridge
  parser-isolated:
    driver: bridge
    internal: true

volumes:
  deployforge-data:

