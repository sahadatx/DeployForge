nameOverride: ""
fullnameOverride: ""

images:
  api:
    repository: ghcr.io/sahadatx/deployforge-api
    tag: "0.1.0"
    digest: ""
    pullPolicy: IfNotPresent
  worker:
    repository: ghcr.io/sahadatx/deployforge-api
    tag: "0.1.0"
    digest: ""
    pullPolicy: IfNotPresent
  dashboard:
    repository: ghcr.io/sahadatx/deployforge-dashboard
    tag: "0.1.0"
    digest: ""
    pullPolicy: IfNotPresent
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

replicas:
  api: 2
  worker: 2
  dashboard: 1

autoscaling:
  api:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  worker:
    enabled: true
    minReplicas: 2
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  api:
    enabled: true
    minAvailable: 1
  worker:
    enabled: true
    minAvailable: 1

database:
  # Supply a managed PostgreSQL URL through the cluster secret manager.
  existingSecret: deployforge-runtime
  urlKey: database_url
  pool:
    size: 3
    maxOverflow: 2
    timeoutSeconds: 30
    recycleSeconds: 1800
  tls:
    enabled: true
    sslMode: verify-full
    rootCertKey: database_ca.crt
    mountPath: /run/secrets/postgres-ca

secrets:
  existingSecret: deployforge-runtime
  keys:
    sessionSecret: session_secret
    oidcClientSecret: oidc_client_secret
    buildCallbackSecret: build_callback_secret
    githubActionsToken: github_actions_token
    argocdAuthToken: argocd_auth_token

config:
  buildProvider: github_actions
  logLevel: INFO
  frontendBaseUrl: https://deployforge.example.com
  sessionCookieName: deployforge_session
  sessionTtlSeconds: 43200
  oidc:
    discoveryUrl: https://identity.example.com/.well-known/openid-configuration
    clientId: deployforge
    redirectUri: https://deployforge.example.com/api/v1/auth/callback
    groupClaim: groups
    groupRoleMappings: "{}"
  github:
    enabled: false
    apiUrl: https://api.github.com
    serverUrl: https://github.com
    workflowPath: .github/workflows/deployforge-build.yml
    infrastructureWorkflowPath: .github/workflows/deployforge-infrastructure.yml
    callbackPublicUrl: https://deployforge.example.com
    callbackTimeoutSeconds: 14400
  argocd:
    enabled: false
    apiUrl: ""
    apiTimeoutSeconds: 15
    syncTimeoutSeconds: 1800
    reconcileIntervalSeconds: 10
  workerHeartbeatIntervalSeconds: 10
  workerHeartbeatStaleAfterSeconds: 30
  telemetryRetentionDays: 31
  telemetry:
    otlpEndpoint: ""
    otlpTracesEndpoint: ""
    otlpMetricsEndpoint: ""
    otlpHeaders: ""

resources:
  api:
    requests: { cpu: 250m, memory: 384Mi }
    limits: { cpu: "2", memory: 1Gi }
  worker:
    requests: { cpu: 250m, memory: 384Mi }
    limits: { cpu: "2", memory: 1Gi }
  dashboard:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

backup:
  enabled: false
  schedule: "17 */6 * * *"
  timeZone: Etc/UTC
  image:
    repository: ghcr.io/sahadatx/deployforge-postgres-backup
    tag: "0.1.0"
    digest: ""
    pullPolicy: IfNotPresent
  bucket: ""
  prefix: deployforge/postgres
  region: us-east-1
  endpointUrl: ""
  ageRecipient: ""
  sseKmsKeyId: ""
  temporaryStorageLimit: 20Gi
  objectLock:
    mode: COMPLIANCE
    retentionDays: 90
  serviceAccount:
    name: ""
    annotations: {}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  resources:
    requests: { cpu: 100m, memory: 128Mi, ephemeral-storage: 1Gi }
    limits: { cpu: "1", memory: 512Mi, ephemeral-storage: 20Gi }

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: deployforge.example.com
  tls:
    enabled: true
    secretName: deployforge-tls

nodeSelector: {}
tolerations: []
affinity: {}
