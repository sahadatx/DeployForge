{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (printf "%s-backup" (include "deployforge.fullname" .)) .Values.backup.serviceAccount.name }}
  labels:
    {{- include "deployforge.labels" . | nindent 4 }}
  {{- with .Values.backup.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
